<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birthday Cake 🎂</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      #mainTitle {
        font-size: clamp(22px, 8vw, 32px);
        font-family: "Pixelify Sans", sans-serif;
        margin-bottom: 8px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div id="birthdayText"></div>

      <div class="cake-container" id="cakeContainer">
        <!-- Senin pasta CSS'in -->
        <div class="cake" id="cake"></div>
        <!-- Mumlar JS ile buraya eklenir -->
        <div class="candles" id="candles"></div>
      </div>

      <!-- Mektup -->
      <div class="letter" id="letter"></div>
    </div>

    <script>
      // ---- URL parametreleri: ?name=Ayşe&candles=8 ----
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "Friend";
      let candleCount = parseInt(params.get("candles")) || 4;
      candleCount = Math.min(Math.max(candleCount, 1), 30);

      // textContent kullanıldı (URL'den gelen ismi innerHTML'e basmak XSS açığı olur)
      const birthdayText = document.getElementById("birthdayText");
      const mainTitle = document.createElement("div");
      mainTitle.id = "mainTitle";
      mainTitle.textContent = `Happy Birthday, ${name}!`;
      birthdayText.append(mainTitle);

      // ---- Mektup ----  (?name=Ayşe&from=Mehmet)
      const hasName = params.has("name") && params.get("name").trim() !== "";
      const from = (params.get("from") || "").trim();
      const letterParagraphs = [
        `(mumları ipleme elimden geleni yaptım :c)Bugün senin günün ve bu yazıyı yazarken yüzümde kocaman bir gülümseme var çünkü seni düşünmek bile insanı mutlu ediyor.`,
        `Sen, hayatıma girdiğin her yere ışık getiren nadir insanlardansın. Kendin hakkında senin ya da başkalarının oluşturdugu bu sevilmeyi hak etmediğin kafasının ne kadar mantıksız oldugunu kanıtlayabileceğin günü bekliyorum. Sıcacık bir gülüşün, insanı hemen "evinde" hissettiren bir enerjin var. Çok az kişide bulunan bu yeteneğin ne kadar değerli olduğunu bilmeni isterim.`,
        `Zekandan yüreğinin büyüklüğüne ve hep hissettirdiğin o içten samimiyeti cok nadir özellikler. Benim ancak hayal edebildiğim şeylere cok rahatlıkla ulaşma potansiyelin var. Bir derdim olduğunda ilk aklıma gelen kişi sensin, çünkü beni dinlediğini, yargılamadığını ve en doğru sözü bulacağını biliyorum. Başkalarının başarısına gerçekten sevinebilen, zor günlerde sessizce yanında duran birisin. Böyle bir insanı tanımak büyük şans.`,
        `Sana layık gördüğümden daha azına razı olmanı istemiyorum ve her şeyden önce kötü bir insan olmadıgını, sadece hepiiz gibi insan oldugunu ve sevgiyle layık oldugunu soylemek istiyorum. Zorluklar karşısında pes etmeyip gülümseyerek yoluna devam etmeni izlemek, bana da güç veriyor. Üstelik tüm bunları yaparken hiç gösteriş yapmıyorsun, bence en güzel yanın da bu.`,
        `İyi ki de bu okulu seçip senle tanışma fırsatı bulmuşum. Dilerim yeni yaşın sana sağlık, huzur ve sevdiklerinle dolu sayısız güzel an getirsin. Hayallerinin hepsi gerçek olsun, güldüğün günler hiç eksilmesin. Sen hep mutlu ol, çünkü sen bunu fazlasıyla hak ediyorsun.`,
        `İyi ki doğdun, iyi ki varsın, iyi ki hayatımdasın. Mumları üflerken dilek tutmayı unutmaaaa :3`,
      ];

      const letter = document.getElementById("letter");
      const heading = document.createElement("h2");
      heading.textContent = hasName ? `Doğum Günün Kutlu Olsun, ${name}! 🎂` : "Doğum Günün Kutlu Olsun! 🎂";
      letter.appendChild(heading);
      letterParagraphs.forEach((t) => {
        const p = document.createElement("p");
        p.textContent = t;
        letter.appendChild(p);
      });
      const sign = document.createElement("p");
      sign.className = "sign";
      sign.textContent = from ? `Sevgiyle\n${from}` : "Selin,";
      letter.appendChild(sign);

      // ---- Mumları oluştur ----
      // Koordinatlar pasta piksel-art'ının kendi birimlerinde (150x100).
      // Pasta kubbesinin üstü yaklaşık x:35–110, y:45 civarı.
      const layer = document.getElementById("candles");
      const container = document.getElementById("cakeContainer");
      const CAKE_LEFT = 38; // mumların yayılacağı aralık: pastanın ön yüzü (pasta birimi)
      const CAKE_RIGHT = 107;
      const CANDLE_BASE_Y = 90; // ön sıranın tabanı: pastanın önünde, tabağın üstünde
      const ORIGIN_X = 57.5; // mum sprite'ının taban ortası (CSS'teki transform-origin)
      const ORIGIN_Y = 95;
      const SPRITE_H = 85; // mum sprite yüksekliği (alev dahil)
      let SCALE = 2; // CSS'teki --s (pasta ölçeği); fitScale() günceller
      let topMost = 0; // en yukarıdaki alevin y'si (pasta birimi)

      // Pastayı ekrana sığdır: genişliğe ve yüksekliğe göre, 0.2'lik adımlarla (piksel net kalsın)
      function fitScale() {
        const w = (window.innerWidth - 24) / 135; // pasta resmi 135 birim geniş
        const h = (window.innerHeight - 140) / 90; // başlık + mum payı
        const s = Math.min(w, h, 3);
        SCALE = Math.max(1.2, Math.floor(s * 5) / 5);
        document.documentElement.style.setProperty("--s", SCALE);
        container.style.marginTop = `${Math.max(20, 20 - (topMost - 10) * SCALE)}px`;
      }
      window.addEventListener("resize", fitScale); // telefon yatay/dikey çevrilince

      // Mum sayısı arttıkça mumlar küçülür ki pastanın önüne sığsınlar
      function layoutFor(count) {
        if (count <= 4) return { s: 0.4, perRow: 4 }; // 4px piksel
        if (count <= 12) return { s: 0.3, perRow: 6 }; // 3px piksel
        return { s: 0.2, perRow: 9 }; // 2px piksel
      }

      function createCandles(count) {
        layer.innerHTML = "";
        const { s, perRow } = layoutFor(count);
        const rowLift = 20 * s; // arkadaki sıra yukarıda: alevler birbirini kapatmasın
        const rows = Math.ceil(count / perRow);

        // En yukarıdaki alev pasta alanının dışına taşarsa üstte yer aç
        topMost = CANDLE_BASE_Y - (rows - 1) * rowLift - SPRITE_H * s;
        fitScale();

        for (let i = 0; i < count; i++) {
          const row = Math.floor(i / perRow);
          const col = i % perRow;
          const inRow = Math.min(perRow, count - row * perRow);

          // Aralığa eşit dağıt; her ikinci sıra yarım adım kayık dursun
          const span = CAKE_RIGHT - CAKE_LEFT;
          const step = span / (inRow + 1);
          const cx = CAKE_LEFT + step * (col + 1) + (row % 2 ? step / 3 : 0);
          const baseY = CANDLE_BASE_Y - row * rowLift;

          const candle = document.createElement("div");
          candle.classList.add("candle");
          candle.style.transform = `scale(${s})`;
          candle.style.left = `${cx - ORIGIN_X}px`;
          candle.style.top = `${baseY - ORIGIN_Y}px`;
          candle.style.zIndex = String(100 - row); // ön sıra önde
          candle.style.setProperty("--delay", `-${Math.random().toFixed(2)}s`);
          layer.appendChild(candle);
        }
      }
      createCandles(candleCount);

      // ---- Üfleme ----
      let blown = false;

      function blowOutCandles() {
        if (blown) return;
        blown = true;

        // Alev animasyonu 1 sn'lik döngü; son iki kare: kıvılcım (%67–83) ve alevsiz (%83–100)
        function freezeAt(candle, ms) {
          const anim = candle.getAnimations()[0];
          if (!anim) return;
          candle.style.animationDelay = "0s";
          anim.effect.updateTiming({ delay: 0 });
          anim.pause();
          anim.currentTime = ms;
        }

        document.querySelectorAll(".candle").forEach((candle) => {
          const delay = Math.random() * 1000;
          setTimeout(() => {
            candle.classList.add("blowing");
            freezeAt(candle, 750); // kıvılcım karesi
            setTimeout(() => {
              candle.classList.remove("blowing");
              candle.classList.add("blown");
              freezeAt(candle, 950); // alevsiz kare
            }, 250);
          }, delay);
        });

        setTimeout(() => {
          mainTitle.textContent = `Yayy! Happy Birthday, ${name}! 🎉`;
        }, 1200);
      }

      // ---- Mikrofon ile üfleme algılama ----
      async function startMicDetection() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioContext.createMediaStreamSource(stream);
          const analyser = audioContext.createAnalyser();
          analyser.fftSize = 512;
          source.connect(analyser);
          if (audioContext.state === "suspended") {
            await audioContext.resume().catch(() => {});
          }

          const dataArray = new Uint8Array(analyser.frequencyBinCount);

          function detectBlow() {
            analyser.getByteFrequencyData(dataArray);

            let highFreqSum = 0;
            let lowFreqSum = 0;
            const midpoint = dataArray.length / 2;
            for (let i = 0; i < dataArray.length; i++) {
              if (i < midpoint) lowFreqSum += dataArray[i];
              else highFreqSum += dataArray[i];
            }

            const highAvg = highFreqSum / (dataArray.length / 2);
            const lowAvg = lowFreqSum / (dataArray.length / 2);
            const ratio = highAvg / (lowAvg + 1);

            const BLOW_RATIO_THRESHOLD = 0.5;
            if (ratio > BLOW_RATIO_THRESHOLD && !blown) {
              blowOutCandles();
            }
            requestAnimationFrame(detectBlow);
          }
          detectBlow();
        } catch (err) {
          console.error("Mic access error:", err);
        }
      }

      // Mikrofon yoksa/izin verilmediyse pastaya tıklayarak da üflenebilir
      document.body.addEventListener("click", blowOutCandles); // sayfanın herhangi bir yerine dokun

      startMicDetection();
    </script>
  </body>
</html>
